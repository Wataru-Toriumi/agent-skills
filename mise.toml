[tools]
node = "26.13.0"
rumdl = "0.3.2"
# Keep package.json as the source of truth for pnpm.
pnpm = "{{ read_json(path='package.json')['packageManager'] | split(pat='@') | last }}"

[tasks.setup]
description = "Install dependencies using the committed lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Lint code and documents, check plugin metadata, and run tests"
run = ["mise run lint:code", "mise run lint:md", "mise run lint:text", "pnpm plugin:check", "pnpm test"]

[tasks."lint:code"]
description = "Check TypeScript with Biome"
run = "pnpm lint:code"

[tasks."fix:code"]
description = "Format TypeScript, organize imports, and apply safe lint fixes"
run = "pnpm fix:code"

[tasks."lint:md"]
description = "Check Markdown formatting"
run = "rumdl check --config .rumdl.toml --deny-config-warnings ."

[tasks."fix:md"]
description = "Fix Markdown formatting and report remaining issues"
run = "rumdl check --config .rumdl.toml --deny-config-warnings --fix ."

[tasks."lint:text"]
description = "Check Japanese text for redundant expressions"
run = "pnpm lint:text"
