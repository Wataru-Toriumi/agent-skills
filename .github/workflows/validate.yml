name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.12.0', '26']
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up tools with mise
        uses: jdx/mise-action@v5
        with:
          cache_key: "{{default}}-node${{ matrix.node }}"

      - name: Install with the committed lockfile
        run: mise run setup

      - name: Lint documents, check plugins, and test commands
        run: mise run check

      - name: Verify tracked files are unchanged
        run: git diff --exit-code
