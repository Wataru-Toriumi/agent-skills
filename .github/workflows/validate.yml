name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.12.0', '26']
    env:
      MISE_NODE_VERSION: ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up tools with mise
        uses: jdx/mise-action@v5
        with:
          cache_key: "{{default}}-node${{ matrix.node }}"

      - name: Install with the committed lockfile
        run: mise run setup

      - name: Lint code and documents, check plugins, and test commands
        run: mise run check

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  release:
    name: Publish plugin releases
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out validated commit and full history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up tools with mise
        uses: jdx/mise-action@v5

      - name: Publish missing plugin releases
        run: mise exec -- node scripts/publish-releases.ts --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
